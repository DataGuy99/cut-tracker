name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build-output.log

      - name: Upload error log on failure
        if: failure()
        run: |
          cat android/build-output.log | tail -300 > build-error.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build-error.log
          git commit -m "build error log" || true
          git push || true

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
