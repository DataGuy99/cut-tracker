name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper and build
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log
      - name: Find and report APK
        run: |
          echo "=== All APKs ===" > apk-report.txt
          find . -name "*.apk" -type f >> apk-report.txt 2>&1
          echo "=== Build outputs ===" >> apk-report.txt
          find . -path "*/outputs/*" -type f >> apk-report.txt 2>&1
          echo "=== Home gradle ===" >> apk-report.txt
          find ~/.gradle -name "*.apk" -type f >> apk-report.txt 2>&1 || true
          cat apk-report.txt
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find ~/.gradle -name "*.apk" -type f | head -1)
          fi
          echo "SELECTED: $APK" >> apk-report.txt
          if [ -n "$APK" ]; then
            cp "$APK" ./cut-tracker.apk
            echo "apk_found=true" >> $GITHUB_OUTPUT
          fi
          # Commit report so Claude can read it
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk-report.txt
          git commit -m "APK build report" || true
          git push || true
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: cut-tracker.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
