name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/keystore.jks
      - name: Generate wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
      - name: Build Release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-output.log
      - name: Commit log
        if: always()
        run: |
          cp android/build-output.log . 2>/dev/null || echo "no log" > build-output.log
          find . -name "*.apk" >> build-output.log 2>&1
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build-output.log -f
          git commit -m "build log" || true
          git push --force || true
      - name: Release APK
        if: success()
        run: |
          APK=$(find android -name "*release*.apk" -type f | head -1)
          [ -n "$APK" ] && cp "$APK" ./cut-tracker.apk
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: cut-tracker.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
