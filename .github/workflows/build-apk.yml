name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log
      - name: Find APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -type f | head -1)
          echo "Found: $APK"
          ls -la "$APK"
          echo "path=$APK" >> $GITHUB_OUTPUT
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-output.log
          if-no-files-found: warn
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
