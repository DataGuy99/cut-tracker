name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace 2>&1 | tee build-output.log
      - name: Find APK
        id: apk
        run: |
          echo "=== Searching everywhere ==="
          find . -name "*.apk" -type f 2>/dev/null || true
          find . -path "*/build/outputs/*" -type f 2>/dev/null || true
          echo "=== Build outputs dir ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "no outputs dir"
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "path=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
          else
            echo "NO APK FOUND"
            echo "=== Full build dir listing ==="
            find android/app/build -type f 2>/dev/null | head -50 || echo "no build dir"
          fi
      - name: Upload APK as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-output.log
          if-no-files-found: warn
      - name: Create Release
        if: steps.apk.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
