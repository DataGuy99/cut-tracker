name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --info 2>&1 | tee build-output.log
          echo "EXIT CODE: $?"
      - name: Find APK and release
        run: |
          echo "=== Searching ===" | tee apk-report.txt
          find . -name "*.apk" -type f | tee -a apk-report.txt
          APK=$(find . -name "*.apk" -type f | head -1)
          echo "SELECTED: $APK" | tee -a apk-report.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk-report.txt
          git commit -m "build report" || true
          git push || true
          if [ -n "$APK" ]; then
            cp "$APK" ./cut-tracker.apk
          fi
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Cut Tracker v1.0 build ${{ github.run_number }}
          files: cut-tracker.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
